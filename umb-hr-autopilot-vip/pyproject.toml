[project]
name = "umb-hr-autopilot-vip"
version = "0.2.0"
description = "UMB HR Autopilot VIP — Python Control Center (PHASE 2 Foundation)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-socketio>=5.11",
  "redis>=5.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

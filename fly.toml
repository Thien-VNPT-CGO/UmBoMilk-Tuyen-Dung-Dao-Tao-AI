app = "umbomilk-hr-thien-cgo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[deploy]
  release_command = "node -e \"console.log('Fly release check ok')\""

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

services:
  - type: web
    name: umbomilk-hr
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # RÀNG BUỘC: disk persistent để mã NV + key giữ nguyên qua mọi lần cập nhật/redeploy.
    # Không có disk, Render xóa data/db.json mỗi lần deploy -> mất toàn bộ mã NV/key.
    disk:
      name: umbmilk-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      # Google Sheet Operational Data Hub - Đồng bộ theo render hiện tại 05/09/2026 (đang đảo so với Spec 28/08)
      - key: GOOGLE_SHEET_SPREADSHEET_ID
        value: 17iXM0zc1m17aX9AZrFMjOkPRMy2_CwWfjTRZSUPQF2w
      - key: GOOGLE_SHEET_TARGET_DATABASE_ID
        value: 1rcqEKraSRhr-Tn9qwlhADlkQUei8j65bXeHF_Tmkd38
      - key: GOOGLE_SHEET_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbz_umbomilk_apps_script/exec
      - key: GOOGLE_SHEET_WEBHOOK_URL_1
        value: https://script.google.com/macros/s/AKfycbxNfcYVUqqIgZPhXnGeY4aLdnH3ebJFutjGy-VIbxVEc1DV-l93RWo4ic6fc1IvYaM/exec
      - key: GOOGLE_SHEET_WEBHOOK_URL_2
        value: https://script.google.com/macros/s/AKfycbxYZhMjR9riLFQfYEkgLfub33XtWlSP2IokghTt82Lb4SQVL4tKxQyNACr69yC0ACA/exec
      - key: GOOGLE_SHEET_WEBHOOK_SECRET
        value: umbomilk_secret_2026
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        value: umbomilk-hr@umbomilk-hr.iam.gserviceaccount.com
      # Private Key phải set thủ công trên Render Dashboard (Environment) - dạng 1 dòng với \n
      # Ví dụ: -----BEGIN PRIVATE KEY-----\nMIIEv...==\n-----END PRIVATE KEY-----\n
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        value: 1-Wy-Di6KvfeGCKoTV7TSuFQpY_yKNy-1
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: FINANCE_MASTER_ID
        value: 13Y4rycVMq2-HXGySjaJJBl2YZswKEaK5WkSLWVkLjuY
      - key: DATABASE_URL
        sync: false
      - key: FINANCE_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbxYZhMjR9riLFQfYEkgLfub33XtWlSP2IokghTt82Lb4SQVL4tKxQyNACr69yC0ACA/exec
      - key: FINANCE_WEBHOOK_SECRET
        value: umbomilk_secret_2026
      # Ngân hàng đề trắc nghiệm đầu ra — nguồn thật duy nhất là Google Sheet (HR sửa trên Sheet, server tự kéo 60s)
      - key: QUIZ_BANK_SPREADSHEET_ID
        value: 1h06TrHMRnBOHMkp7Ri4Rz8yRw8ptemQp0ftjMldHYdc
      - key: QUIZ_BANK_SHEET_NAME
        value: ""

  # UMB HR AUTOPILOT VIP (Python Control Center) — giao dien dieu hanh duy nhat cho HR.
  # CANH BAO: plan free tu sleep khi khong co traffic -> automation 24/7
  # (reminder, detector, morning brief) chet theo. Production that can plan
  # tra phi (starter+) cho CA 2 services + DB (Master §46).
  - type: web
    name: umbvip
    runtime: docker
    region: singapore
    plan: free
    rootDir: umb-hr-autopilot-vip
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VIP_ENV
        value: production
      - key: VIP_PORT
        value: 10000
      # Noi bo Render: Core service lang nghe PORT 10000
      - key: NODE_CORE_URL
        value: http://umbomilk-hr:10000
      - key: DATABASE_URL
        fromDatabase:
          name: umbomilk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: umbvip-redis
          property: connectionString
      - key: VIP_SECRET_KEY
        generateValue: true
      - key: VIP_SERVICE_SECRET
        generateValue: true
      # AI/Zalo/Google lay tu Node Core settings — chi set khi can dich vu truc tiep:
      - key: AI_API_KEY
        sync: false
      - key: ZALO_WEBHOOK_SECRET
        sync: false

  # Redis cho jobs/locks/idempotency VIP (PHASE 9). Thieu thi DEGRADED + memory.
  - type: redis
    name: umbvip-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction

# Postgres cho VIP Stage A (workflow/license/...) + Stage B migration.
# Free het han 90 ngay — production that dung plan tra phi + backup.
databases:
  - name: umbomilk-db
    region: singapore
    plan: free
    ipAllowList: []

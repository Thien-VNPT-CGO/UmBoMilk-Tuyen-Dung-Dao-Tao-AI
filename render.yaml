services:
  - type: web
    name: umbomilk-hr
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # RÀNG BUỘC: disk persistent để mã NV + key giữ nguyên qua mọi lần cập nhật/redeploy.
    # Không có disk, Render xóa data/db.json mỗi lần deploy -> mất toàn bộ mã NV/key.
    disk:
      name: umbmilk-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      # Google Sheet Operational Data Hub - Đồng bộ theo render hiện tại 05/09/2026 (đang đảo so với Spec 28/08)
      - key: GOOGLE_SHEET_SPREADSHEET_ID
        value: 17iXM0zc1m17aX9AZrFMjOkPRMy2_CwWfjTRZSUPQF2w
      - key: GOOGLE_SHEET_TARGET_DATABASE_ID
        value: 1rcqEKraSRhr-Tn9qwlhADlkQUei8j65bXeHF_Tmkd38
      - key: GOOGLE_SHEET_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbz_umbomilk_apps_script/exec
      - key: GOOGLE_SHEET_WEBHOOK_URL_1
        value: https://script.google.com/macros/s/AKfycbxNfcYVUqqIgZPhXnGeY4aLdnH3ebJFutjGy-VIbxVEc1DV-l93RWo4ic6fc1IvYaM/exec
      - key: GOOGLE_SHEET_WEBHOOK_URL_2
        value: https://script.google.com/macros/s/AKfycbxYZhMjR9riLFQfYEkgLfub33XtWlSP2IokghTt82Lb4SQVL4tKxQyNACr69yC0ACA/exec
      - key: GOOGLE_SHEET_WEBHOOK_SECRET
        value: umbomilk_secret_2026
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        value: umbomilk-hr@umbomilk-hr.iam.gserviceaccount.com
      # Private Key phải set thủ công trên Render Dashboard (Environment) - dạng 1 dòng với \n
      # Ví dụ: -----BEGIN PRIVATE KEY-----\nMIIEv...==\n-----END PRIVATE KEY-----\n
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        value: 1-Wy-Di6KvfeGCKoTV7TSuFQpY_yKNy-1
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: FINANCE_MASTER_ID
        value: 13Y4rycVMq2-HXGySjaJJBl2YZswKEaK5WkSLWVkLjuY
      - key: DATABASE_URL
        sync: false
      - key: FINANCE_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbxYZhMjR9riLFQfYEkgLfub33XtWlSP2IokghTt82Lb4SQVL4tKxQyNACr69yC0ACA/exec
      - key: FINANCE_WEBHOOK_SECRET
        value: umbomilk_secret_2026

